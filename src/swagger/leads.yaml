paths:
  /leads:
    post:
      tags:
        - Leads
      summary: Add New Lead
      description: >
        Create a manual lead (booked, enquiry, lossofsale, or justdial type).
        **createdBy** is automatically set from the authenticated user's employeeId — do NOT pass it in the request body.
        **createdAt** defaults to the server time at creation.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - leadtype
                - phone
                - callStatus
              properties:
                leadtype:
                  type: string
                  enum: [booked, enquiry, lossofsale, justdial]
                  description: "Type of lead (manual, booking, lossofsale, or justdial)"
                  example: "enquiry"
                phone:
                  type: string
                  example: "9876543210"
                name:
                  type: string
                  example: "Alice Smith"
                callStatus:
                  type: string
                  enum: [connected, "not connected", interested, "not interested", forwarded]
                  example: "connected"
                store:
                  type: string
                  example: "Zorucci - Edapally"
                functionDate:
                  type: string
                  format: date-time
                  example: "2026-05-10T00:00:00Z"
                callDuration:
                  type: string
                  example: "120"
                subCategory:
                  type: string
                  example: "Bridal"
                closingReason:
                  type: string
                  description: "Required if leadtype is lossofsale"
                  example: "Price too high"
                closingAction:
                  type: string
                  example: "Closed"
                itemCategory:
                  type: string
                  example: "Lehenga"
                remarks:
                  type: string
                  example: "Looking for red color."
                markasComplaint:
                  type: boolean
                  description: "If true → leadStatus = complaint"
                  example: false
                markasFollowup:
                  type: boolean
                  description: "If true → leadStatus = followup"
                  example: true
                followupDate:
                  type: string
                  description: "Mandatory if callStatus is 'interested' or 'not connected'"
                  format: date-time
                  example: "2026-03-20T10:00:00Z"
      responses:
        '201':
          description: Lead created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Lead added successfully"
        '400':
          description: Bad request - Invalid input
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /leads/completed:
    get:
      tags:
        - Leads
      summary: Report API - Completed Leads
      description: >
        Return leads where leadStatus = completed.
        Date filters use **updatedAt**.
      security:
        - BearerAuth: []
      parameters:
        - name: fromDate
          in: query
          schema:
            type: string
            example: "2026-03-15"
          description: >
            Filter by updatedAt (inclusive). 
            Formats: YYYY-MM-DD (e.g. 2026-03-15) or ISO (e.g. 2026-03-15T00:00:00).
            If time is missing, backend automatically expands to start of day.
        - name: toDate
          in: query
          schema:
            type: string
            example: "2026-03-15"
          description: >
            Filter by updatedAt (inclusive).
            Formats: YYYY-MM-DD (e.g. 2026-03-15) or ISO (e.g. 2026-03-15T23:59:59).
            If time is missing, backend automatically expands to end of day.
        - name: store
          in: query
          schema:
            type: string
            example: "Zorucci - Edapally"
        - name: leadtype
          in: query
          schema:
            type: string
            enum: [return, booked, enquiry, bookingConfirmation, justdial, lossofsale]
            example: "enquiry"
        - name: page
          in: query
          schema:
            type: integer
            example: 1
        - name: limit
          in: query
          schema:
            type: integer
            example: 10
      responses:
        '200':
          description: List of completed leads
          content:
            application/json:
              schema:
                type: object
                properties:
                  leads:
                    type: array
                    items:
                      type: object
                      properties:
                        _id: 
                          type: string
                          example: "6452abc123"
                        createdAt: 
                          type: string
                          format: date-time
                          description: "Original Lead Date"
                          example: "2026-03-10T10:00:00Z"
                        store: 
                          type: string
                          example: "Zorucci - Edapally"
                        name: 
                          type: string
                          description: "Customer name (manual leads)"
                          example: "Alice Smith"
                        customerName: 
                          type: string
                          description: "Customer name (synced leads — always use this if name is empty)"
                          example: "Alice Smith"
                        phone: 
                          type: string
                          example: "9876543210"
                        leadtype: 
                          type: string
                          enum: [return, booked, enquiry, bookingConfirmation, justdial, lossofsale]
                          example: "enquiry"
                        leadStatus: 
                          type: string
                          enum: [completed]
                          description: "Always 'completed' for this endpoint"
                          example: "completed"
                        functionDate: 
                          type: string
                          format: date-time
                          example: "2026-05-10T00:00:00Z"
                        subCategory: 
                          type: string
                          example: "Bridal"
                        closingAction: 
                          type: string
                          example: "Purchased"
                        remarks: 
                          type: string
                          example: "Done."
                        followupDate: 
                          type: string
                          format: date-time
                          example: "2026-03-12T10:00:00Z"
                        followupremarks: 
                          type: string
                          example: "Called."
                        updatedAt: 
                          type: string
                          format: date-time
                          description: "Action Date (when telecaller completed the lead)"
                          example: "2026-03-15T15:00:00Z"
                        updatedBy: 
                          type: string
                          description: "Auto-populated from authenticated user (employeeId)"
                          example: "emp123"
                        callDuration: 
                          type: string
                          example: "120"
                        followupcallDuration: 
                          type: string
                          example: "60"
                  total: 
                    type: integer
                    example: 50
                  page: 
                    type: integer
                    example: 1
                  limit: 
                    type: integer
                    example: 10
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /leads/followups:
    get:
      tags:
        - Leads
      summary: Followup List
      description: >
        Return leads where leadStatus = followup.
        Date filters use **followupDate**.
        Sorted by **followupDate** ascending (closest callbacks first).
      security:
        - BearerAuth: []
      parameters:
        - name: store
          in: query
          schema:
            type: string
            example: "Zorucci - Edapally"
        - name: fromDate
          in: query
          schema:
            type: string
            example: "2026-03-15"
          description: >
            Filter by followupDate (inclusive).
            Formats: YYYY-MM-DD or ISO.
        - name: toDate
          in: query
          schema:
            type: string
            example: "2026-03-15"
          description: >
            Filter by followupDate (inclusive).
            Formats: YYYY-MM-DD or ISO.
      responses:
        '200':
          description: List of followup leads
          content:
            application/json:
              schema:
                type: object
                properties:
                  leads:
                    type: array
                    items:
                      type: object
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /leads/complaints:
    get:
      tags:
        - Leads
      summary: Complaint List
      description: >
        Return leads where leadStatus = complaint.
        Date filters use **updatedAt**.
      security:
        - BearerAuth: []
      parameters:
        - name: store
          in: query
          schema:
            type: string
            example: "Zorucci - Edapally"
        - name: fromDate
          in: query
          schema:
            type: string
            example: "2026-03-15"
          description: >
            Filter by updatedAt (inclusive).
            Formats: YYYY-MM-DD or ISO.
        - name: toDate
          in: query
          schema:
            type: string
            example: "2026-03-15"
          description: >
            Filter by updatedAt (inclusive).
            Formats: YYYY-MM-DD or ISO.
        - name: page
          in: query
          schema:
            type: integer
            example: 1
        - name: limit
          in: query
          schema:
            type: integer
            example: 10
      responses:
        '200':
          description: List of complaint leads
          content:
            application/json:
              schema:
                type: object
                properties:
                  leads:
                    type: array
                    items:
                      type: object
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /leads/followups/{id}:
    get:
      tags:
        - Leads
      summary: Get Followup Lead Detail by ID
      description: Fetch a single followup lead by ID. Works across all lead types. Filters by leadStatus = followup.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "6452abc123"
          description: Lead MongoDB _id
      responses:
        '200':
          description: Followup lead detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: 
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id: 
                        type: string
                        example: "6452abc123"
                      customerName: 
                        type: string
                        example: "Alice Smith"
                      phone: 
                        type: string
                        example: "9876543210"
                      store: 
                        type: string
                        example: "Zorucci - Edapally"
                      remarks: 
                        type: string
                        example: "Wants to rethink."
                      subCategory: 
                        type: string
                        example: "Bridal"
                      functionDate: 
                        type: string
                        format: date-time
                        example: "2026-05-10T00:00:00Z"
                      closeAction: 
                        type: string
                        example: ""
                      followupDate: 
                        type: string
                        format: date-time
                        example: "2026-03-20T10:00:00Z"
                      leadtype: 
                        type: string
                        example: "enquiry"
                      leadStatus: 
                        type: string
                        example: "followup"
                      callDuration: 
                        type: string
                        example: "45"
                      updatedAt: 
                        type: string
                        format: date-time
                        example: "2026-03-15T10:00:00Z"
        '400':
          description: Invalid ID
        '401':
          description: Unauthorized
        '404':
          description: Lead not found
        '500':
          description: Internal server error
    post:
      tags:
        - Leads
      summary: Update Followup
      description: >
        Update a followup lead and set leadStatus = completed.
        **updatedBy** and **updatedAt** are automatically set by the server from the authenticated user.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "6452abc123"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                followupclosingAction:
                  type: string
                  example: "Purchased"
                followupremarks:
                  type: string
                  example: "Customer bought the dress."
                followupcallDuration:
                  type: string
                  example: "120"
      responses:
        '200':
          description: Followup updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Lead updated to completed"
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Lead not found
        '500':
          description: Internal server error

  /leads/complaints/{id}:
    get:
      tags:
        - Leads
      summary: Get Complaint Lead Detail by ID
      description: Fetch a single complaint lead by ID. Works across all lead types. Filters by leadStatus = complaint.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "6452abc123"
          description: Lead MongoDB _id
      responses:
        '200':
          description: Complaint lead detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: 
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id: 
                        type: string
                        example: "6452abc123"
                      customerName: 
                        type: string
                        example: "Alice Smith"
                      leadType: 
                        type: string
                        example: "enquiry"
                      phone: 
                        type: string
                        example: "9876543210"
                      store: 
                        type: string
                        example: "Zorucci - Edapally"
                      functionDate: 
                        type: string
                        format: date-time
                        example: "2026-05-10T00:00:00Z"
                      subCategory: 
                        type: string
                        example: "Bridal"
                      remarks: 
                        type: string
                        example: "Fitting issue."
                      leadStatus: 
                        type: string
                        example: "complaint"
                      updatedAt: 
                        type: string
                        format: date-time
                        example: "2026-03-15T10:00:00Z"
        '400':
          description: Invalid ID
        '401':
          description: Unauthorized
        '404':
          description: Lead not found
        '500':
          description: Internal server error
    post:
      tags:
        - Leads
      summary: Update Complaint Lead
      description: >
        Update remarks and metadata for an existing complaint lead. 
        **leadStatus remains as "complaint"**.
        **updatedBy** and **updatedAt** are automatically set by the server from the authenticated user.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "6452abc123"
          description: Lead MongoDB _id
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                remarks:
                  type: string
                  description: New complaint remarks
                  example: "Resolved fitting issue."
      responses:
        '200':
          description: Complaint updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Complaint updated"
        '400':
          description: Invalid ID or request
        '401':
          description: Unauthorized
        '404':
          description: Complaint lead not found
        '500':
          description: Internal server error

  /leads/performance:
    get:
      tags:
        - Leads
      summary: Get My Call Performance
      description: Get personal call counts (followup, complaint, completed) for the authenticated telecaller. Filtered by **updatedAt**.
      security:
        - BearerAuth: []
      parameters:
        - name: fromDate
          in: query
          schema:
            type: string
            example: "2026-03-15"
          description: Filter from date (YYYY-MM-DD).
        - name: toDate
          in: query
          schema:
            type: string
            example: "2026-03-15"
          description: Filter to date (YYYY-MM-DD).
      responses:
        '200':
          description: My performance data retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  telecallerId: 
                    type: string
                    example: "emp123"
                  name: 
                    type: string
                    example: "John Doe"
                  totalCalls: 
                    type: number
                    example: 25
                  followup: 
                    type: number
                    example: 5
                  complaint: 
                    type: number
                    example: 2
                  completed: 
                    type: number
                    example: 18
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
