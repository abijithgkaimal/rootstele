paths:
  /customers/check-phone:
    get:
      tags:
        - Customers
      summary: Check phone for incoming call popup
      description: |
        Used when an incoming call arrives. Normalizes the phone number and looks up the Customer collection.
        Returns popupType to tell the frontend which popup to show.
        Requires telecaller auth (JWT Bearer or Basic).
      security:
        - BearerAuth: []
      parameters:
        - name: phone
          in: query
          required: true
          schema:
            type: string
            example: "+91-9876543210"
          description: Raw phone number (any format; will be normalized to last 10 digits)
      responses:
        '200':
          description: Check result
          content:
            application/json:
              schema:
                oneOf:
                  - description: Customer not found
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: true
                      data:
                        type: object
                        properties:
                          exists:
                            type: boolean
                            example: false
                          popupType:
                            type: string
                            example: newLeadPopup
                          options:
                            type: array
                            items:
                              type: string
                            example: [enquiry, booked]
                  - description: Customer found
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: true
                      data:
                        type: object
                        properties:
                          exists:
                            type: boolean
                            example: true
                          popupType:
                            type: string
                            enum: [followupPopup, reportPopup, complaintPopup, returnPopup, bookingConfirmationPopup, newLeadPopup]
                            example: "followupPopup"
                          customer:
                            type: object
                            properties:
                              _id:
                                type: string
                                example: "cust123"
                              phone:
                                type: string
                                example: "9876543210"
                              name:
                                type: string
                                example: "Alice Smith"
                              leadCount:
                                type: integer
                                example: 3
                              latestLeadStatus:
                                type: string
                                example: "followup"
                              latestLeadType:
                                type: string
                                example: "enquiry"
                              latestStore:
                                type: string
                                example: "Zorucci - Edapally"
                          lead:
                            type: object
                            description: Latest lead document from LeadMaster
        '400':
          description: Bad request - Missing phone number
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /customers/{id}/history:
    get:
      tags:
        - Customers
      summary: Get customer lead history
      description: Returns all LeadMaster records for the given customer (by Customer _id). Newest first.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "cust123"
          description: Customer _id
      responses:
        '200':
          description: Customer and their leads
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      customer:
                        type: object
                      leads:
                        type: array
                        items:
                          type: object
        '400':
          description: Invalid ID
        '401':
          description: Unauthorized
        '404':
          description: Customer not found
        '500':
          description: Internal server error
