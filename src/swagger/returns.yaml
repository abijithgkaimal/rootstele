paths:
  /leads/returns:
    get:
      tags:
        - Returns
      summary: Get Return Leads
      description: >
        Return leads where leadtype = return AND leadStatus = new.
        Date filters use **returnDate**.
      security:
        - BearerAuth: []
      parameters:
        - name: store
          in: query
          schema:
            type: string
            example: "Zorucci - Edapally"
          description: Filter by store name.
        - name: fromDate
          in: query
          schema:
            type: string
            example: "2026-03-15"
          description: >
            Filter by returnDate (inclusive).
            Formats: YYYY-MM-DD or ISO.
        - name: toDate
          in: query
          schema:
            type: string
            example: "2026-03-15"
          description: >
            Filter by returnDate (inclusive).
            Formats: YYYY-MM-DD or ISO.
      responses:
        '200':
          description: List of return leads
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /leads/returns/{id}:
    get:
      tags:
        - Returns
      summary: Get Return Lead Detail by ID
      description: Fetch a single return lead by its ID. Used by the Flutter lead detail screen.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "6452abc123"
          description: Lead MongoDB _id
      responses:
        '200':
          description: Return lead detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: 
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id: 
                        type: string
                        example: "6452abc123"
                      customerName: 
                        type: string
                        example: "Alice Smith"
                      store: 
                        type: string
                        example: "Zorucci - Edapally"
                      phone: 
                        type: string
                        example: "9876543210"
                      attendedBy: 
                        type: string
                        example: "emp123"
                      returnDate: 
                        type: string
                        format: date-time
                        example: "2026-03-15T10:00:00Z"
                      bookingDate: 
                        type: string
                        format: date-time
                        example: "2026-03-10T10:00:00Z"
                      subCategory: 
                        type: string
                        example: "Bridal"
                      leadStatus: 
                        type: string
                        example: "new"
                      bookingNo: 
                        type: string
                        example: "BK-1002"
        '400':
          description: Invalid ID
        '401':
          description: Unauthorized
        '404':
          description: Lead not found
        '500':
          description: Internal server error
    post:
      tags:
        - Returns
      summary: Update Return Lead
      description: >
        Update return lead after telecaller call.
        Status priority: markasComplaint → complaint | markasFollowup → followup | default → completed.
        **updatedBy** and **updatedAt** are automatically set by the server from the authenticated user — do NOT pass them in the request body.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "6452abc123"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                service:
                  type: string
                  example: "Excellent"
                callDuration:
                  type: string
                  example: "120"
                noofFunctions:
                  type: number
                  description: "Alias: noofFuctions"
                  example: 1
                noofAttires:
                  type: number
                  example: 2
                competitor:
                  type: string
                  example: "Competitor A"
                rating:
                  type: number
                  example: 5
                remarks:
                  type: string
                  example: "Customer returned items on time."
                markasComplaint:
                  type: boolean
                  description: "If true → leadStatus = complaint"
                  example: false
                markasFollowup:
                  type: boolean
                  description: "If true → leadStatus = followup"
                  example: false
                followupDate:
                  type: string
                  format: date-time
                  example: "2026-03-20T10:00:00Z"
      responses:
        '200':
          description: Updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Return lead updated"
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Lead not found
        '500':
          description: Internal server error
