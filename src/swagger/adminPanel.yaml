paths:
  /admin/login:
    post:
      tags:
        - Admin Panel
      summary: "Admin login"
      description: "Admin panel login endpoint"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: admin123
      responses:
        '200':
          description: "Login successful"
        '401':
          description: "Invalid admin credentials"

  /admin/logout:
    post:
      tags:
        - Admin Panel
      summary: "Admin logout"
      description: "Logs the admin user out of the dashboard"
      responses:
        '200':
          description: "Logout successful"

  /admin/dashboard-summary:
    get:
      tags:
        - Admin Panel
      summary: "Get Dashboard Summary"
      description: "Get summary stats for dashboard."
      responses:
        '200':
          description: "Success"
  /admin/telecaller-leaderboard:
    get:
      tags:
        - Admin Panel
      summary: "Get Telecaller Leaderboard"
      description: "Get performance stats for all active telecallers."
      responses:
        '200':
          description: "Success"
  /admin/telecallers/{employeeId}/summary:
    get:
      tags:
        - Admin Panel
      summary: "Get Telecaller Detail Summary"
      parameters:
        - name: "employeeId"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        '200':
          description: "Success"

  /admin/telecallers/{employeeId}:
    put:
      tags:
        - Admin Panel
      summary: "Update Telecaller Profile"
      description: "Update a telecaller's name, store, role, phone, email, and active status."
      parameters:
        - name: "employeeId"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Varsha N. C"
                store:
                  type: string
                  example: "SG-Edappally"
                role:
                  type: string
                  example: "Telecaller"
                phone:
                  type: string
                  example: "9876543210"
                email:
                  type: string
                  example: "varsha@rootments.in"
                active:
                  type: boolean
                  example: true
      responses:
        '200':
          description: "Telecaller profile updated successfully"
        '400':
          description: "Invalid input"
  /admin/telecallers/{employeeId}/category-performance:
    get:
      tags:
        - Admin Panel
      summary: "Get Category Performance"
      parameters:
        - name: "employeeId"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        '200':
          description: "Success"
  /admin/telecallers/{employeeId}/recent-calls:
    get:
      tags:
        - Admin Panel
      summary: "Get Recent Calls"
      parameters:
        - name: "employeeId"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        '200':
          description: "Success"
  /admin/reports/completed-leads:
    get:
      tags:
        - Admin Panel
      summary: "Get Completed Reports"
      responses:
        '200':
          description: "Success"
  /admin/reports/completed-leads/export:
    get:
      tags:
        - Admin Panel
      summary: "Export Completed Reports to CSV"
      responses:
        '200':
          description: "Success"

  /admin/chat-reports/summary:
    get:
      tags:
        - Admin Panel
        - Chat & Messaging
      summary: "Get Chat Reports Summary"
      description: "Aggregated overview of WhatsApp, Instagram, Facebook conversations, converted leads, and outbound messages."
      parameters:
        - name: "fromDate"
          in: "query"
          schema:
            type: "string"
        - name: "toDate"
          in: "query"
          schema:
            type: "string"
        - name: "channel"
          in: "query"
          schema:
            type: "string"
            enum: ["all", "whatsapp", "instagram", "facebook"]
        - name: "brand"
          in: "query"
          schema:
            type: "string"
            enum: ["all", "suitor_guy", "zorucci", "dapper_squad"]
      responses:
        '200':
          description: "Success"

  /admin/chat-reports/telecaller-performance:
    get:
      tags:
        - Admin Panel
        - Chat & Messaging
      summary: "Get Telecaller Chat Performance"
      description: "Track each telecaller's conversations handled across channels, replies sent, resolution rates, and CRM leads converted."
      parameters:
        - name: "fromDate"
          in: "query"
          schema:
            type: "string"
        - name: "toDate"
          in: "query"
          schema:
            type: "string"
        - name: "channel"
          in: "query"
          schema:
            type: "string"
        - name: "brand"
          in: "query"
          schema:
            type: "string"
        - name: "search"
          in: "query"
          schema:
            type: "string"
      responses:
        '200':
          description: "Success"

  /admin/chat-reports/conversations:
    get:
      tags:
        - Admin Panel
        - Chat & Messaging
      summary: "Get Chat Conversations Log"
      description: "Paginated list of multi-channel conversations with participant details and telecaller assignments."
      parameters:
        - name: "page"
          in: "query"
          schema:
            type: "integer"
        - name: "limit"
          in: "query"
          schema:
            type: "integer"
        - name: "channel"
          in: "query"
          schema:
            type: "string"
        - name: "brand"
          in: "query"
          schema:
            type: "string"
        - name: "status"
          in: "query"
          schema:
            type: "string"
        - name: "search"
          in: "query"
          schema:
            type: "string"
      responses:
        '200':
          description: "Success"

  /admin/chat-reports/export:
    get:
      tags:
        - Admin Panel
        - Chat & Messaging
      summary: "Export Chat Reports to CSV"
      responses:
        '200':
          description: "CSV file download"
          content:
            text/csv:
              schema:
                type: "string"

