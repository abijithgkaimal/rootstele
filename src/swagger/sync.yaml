paths:
  /sync/stores:
    post:
      tags:
        - Sync
      summary: Sync Stores
      description: Trigger manual sync of stores from LocationList API.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Store sync completed
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /sync/returns:
    post:
      tags:
        - Sync
      summary: Sync Return Leads
      description: Trigger manual sync of return leads from external API.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Return leads sync completed
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /sync/booking-confirmation:
    post:
      tags:
        - Sync
      summary: Sync Booking Confirmation Leads
      description: Trigger manual sync of booking confirmation leads from external API (Iterates through all store locCodes).
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: initial
          schema:
            type: boolean
            example: true
          description: Whether to perform initial 60-day sync (default is incremental 7-day)
      responses:
        '200':
          description: Booking confirmation sync completed
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /sync/booking-confirmations:
    post:
      tags:
        - Sync
      summary: Sync Booking Confirmation Leads (Alias)
      description: Alias endpoint for /sync/booking-confirmation.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: initial
          schema:
            type: boolean
            example: true
          description: Whether to perform initial 60-day sync (default is incremental 7-day)
      responses:
        '200':
          description: Booking confirmation sync completed
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
