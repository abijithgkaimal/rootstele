paths:
  /webhooks/meta:
    get:
      tags:
        - Webhooks
      summary: Meta Webhook Verification (Hub challenge)
      description: Used by Meta to verify webhook subscriptions for WhatsApp Cloud API, Instagram Graph API, and Facebook Messenger.
      parameters:
        - name: hub.mode
          in: query
          required: true
          schema:
            type: string
          example: subscribe
        - name: hub.verify_token
          in: query
          required: true
          schema:
            type: string
          example: default-verify-token
        - name: hub.challenge
          in: query
          required: true
          schema:
            type: string
          example: 1158201444
      responses:
        '200':
          description: Echoes back hub.challenge string
          content:
            text/plain:
              schema:
                type: string
                example: 1158201444
        '403':
          description: Verification token mismatch

    post:
      tags:
        - Webhooks
      summary: Meta Inbound Event Receiver (WhatsApp, Instagram, Facebook)
      description: Ingests inbound messages and delivery status updates from Meta Graph APIs. Validates X-Hub-Signature-256 HMAC SHA-256.
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: false
          schema:
            type: string
          description: SHA256 HMAC signature of the request payload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Event acknowledged and processing initiated asynchronously
          content:
            text/plain:
              schema:
                type: string
                example: EVENT_RECEIVED

  /webhooks/lead-ingest:
    post:
      tags:
        - Webhooks
      summary: Universal Website & Ad Form Lead Ingestion
      description: Public ingestion endpoint for website forms, WordPress landing pages, and external Meta Lead Ads webhooks. Secured via X-API-KEY.
      parameters:
        - name: x-api-key
          in: header
          required: true
          schema:
            type: string
          description: Custom API key matching CUSTOM_WEBHOOK_API_KEY environment variable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                name:
                  type: string
                  example: Rahul Sharma
                phone:
                  type: string
                  example: '+919876543210'
                store:
                  type: string
                  example: SG-Edappally
                source:
                  type: string
                  example: website-landing-page
                subCategory:
                  type: string
                  example: 3-Piece Wedding Suit
                remarks:
                  type: string
                  example: Customer requested callback regarding groom wear collection
                functionDate:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Lead captured, assigned, and customer profile recomputed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Lead ingested and assigned successfully
                  data:
                    type: object
                    properties:
                      leadId:
                        type: string
                        example: 64f8c2b5e1b2c3d4e5f6a7bd
                      phone:
                        type: string
                        example: '+919876543210'
                      customerName:
                        type: string
                        example: Rahul Sharma
                      assignedTo:
                        type: string
                        example: EMP102
        '400':
          description: Missing or invalid phone number
        '401':
          description: Invalid or missing API key
