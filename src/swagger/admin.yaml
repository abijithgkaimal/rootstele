paths:
  /admin/dashboard:
    get:
      tags:
        - Admin
      summary: Get Dashboard Stats
      description: Get total calls, duration, and complaints for the admin dashboard. Includes telecaller stats. Filtered by **updatedAt**.
      parameters:
        - name: fromDate
          in: query
          schema:
            type: string
            example: "2026-03-15"
          description: Filter from date. Formats: YYYY-MM-DD or ISO.
        - name: toDate
          in: query
          schema:
            type: string
            example: "2026-03-15"
          description: Filter to date. Formats: YYYY-MM-DD or ISO.
        - name: store
          in: query
          schema:
            type: string
            example: "Zorucci - Edapally"
          description: "Store name filter. Use 'All Stores' to bypass."
      responses:
        '200':
          description: Dashboard stats retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCalls: 
                    type: number
                    example: 150
                  totalDuration: 
                    type: number
                    description: "In seconds"
                    example: 7200
                  avgDuration: 
                    type: number
                    example: 48
                  totalComplaints: 
                    type: number
                    example: 5
                  telecallerStats:
                    type: array
                    items:
                      type: object
                      properties:
                        name: 
                          type: string
                          example: "John Doe"
                        empId: 
                          type: string
                          example: "emp123"
                        calls: 
                          type: number
                          example: 50
                        duration: 
                          type: number
                          example: 2400
                        complaints: 
                          type: number
                          example: 2
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /admin/telecaller-summary:
    get:
      tags:
        - Admin
      summary: Telecaller Performance leaderboard
      description: Get performance summary per telecaller. Filtered by **updatedAt**.
      parameters:
        - name: fromDate
          in: query
          schema:
            type: string
            example: "2026-03-15"
          description: Filter from date. Formats: YYYY-MM-DD or ISO.
        - name: toDate
          in: query
          schema:
            type: string
            example: "2026-03-15"
          description: Filter to date. Formats: YYYY-MM-DD or ISO.
        - name: store
          in: query
          schema:
            type: string
            example: "Zorucci - Edapally"
      responses:
        '200':
          description: Summary retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    telecaller: 
                      type: string
                      example: "John Doe"
                    totalCalls: 
                      type: number
                      example: 45
                    totalDuration: 
                      type: number
                      example: 1800
                    avgDuration: 
                      type: number
                      example: 40
                    complaints: 
                      type: number
                      example: 1
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /admin/reports:
    get:
      tags:
        - Admin
      summary: Calls Report
      description: Get detailed reports of completed leads. Filtered by **updatedAt**.
      parameters:
        - name: fromDate
          in: query
          schema:
            type: string
            example: "2026-03-15"
          description: Filter from date. Formats: YYYY-MM-DD or ISO.
        - name: toDate
          in: query
          schema:
            type: string
            example: "2026-03-15"
          description: Filter to date. Formats: YYYY-MM-DD or ISO.
        - name: store
          in: query
          schema:
            type: string
            example: "Zorucci - Edapally"
        - name: leadType
          in: query
          schema:
            type: string
            example: "enquiry"
        - name: telecaller
          in: query
          schema:
            type: string
            example: "emp123"
          description: "Filters by telecaller who completed the lead (matches updatedBy field)."
      responses:
        '200':
          description: Report data retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  leads:
                    type: array
                    items:
                      type: object
                  total: 
                    type: number
                    example: 100
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /admin/complaints/pivot:
    get:
      tags:
        - Admin
      summary: Complaints Pivot Data
      description: Get complaints breakdown by store and category. Filtered by **updatedAt**.
      parameters:
        - name: fromDate
          in: query
          schema:
            type: string
            example: "2026-03-15"
          description: Filter from date. Formats: YYYY-MM-DD or ISO.
        - name: toDate
          in: query
          schema:
            type: string
            example: "2026-03-15"
          description: Filter to date. Formats: YYYY-MM-DD or ISO.
        - name: store
          in: query
          schema:
            type: string
            example: "Zorucci - Edapally"
      responses:
        '200':
          description: Pivot data retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    category: 
                      type: string
                      example: "Fitting Issue"
                    store: 
                      type: string
                      example: "Zorucci - Edapally"
                    total: 
                      type: number
                      example: 3
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /admin/filter-options:
    get:
      tags:
        - Admin
      summary: Dashboard Filter Options
      description: Get unique stores, lead types, and telecallers to populate frontend dropdowns.
      responses:
        '200':
          description: Filter options retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  stores:
                    type: array
                    items:
                      type: string
                    example: ["All Stores", "Zorucci - Edapally"]
                  leadTypes:
                    type: array
                    items:
                      type: string
                    example: ["All Types", "enquiry", "booked"]
                  telecallers:
                    type: array
                    items:
                      type: string
                    example: ["All Telecallers", "John Doe"]
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
