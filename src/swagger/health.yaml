paths:
  /health:
    get:
      summary: Get backend health status
      tags: [System]
      responses:
        '200':
          description: Health check success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Health status retrieved
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      timestamp:
                        type: string
                        format: date-time
                        example: "2026-04-23T10:00:00.000Z"
                      uptime:
                        type: number
                        example: 3600
                      database:
                        type: string
                        example: connected
                      node_version:
                        type: string
                        example: v20.x.x
        '400':
          description: Bad request
        '500':
          description: Internal server error
